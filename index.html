<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Deliverer's Tragedy</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!--
      .stage is sized to the clip's own aspect ratio, so every percentage
      inside it maps to a percentage of the video frame. That is what keeps
      the counter sitting in the seam between the two halves of the scene
      on any display aspect ratio.
    -->
    <div class="stage">
      <video
        class="backdrop"
        src="assets/phainon-honkai-star-rail-moewalls-com.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        aria-hidden="true"
      ></video>

      <div class="counter" id="counter" role="timer" aria-label="Clock">
        <div class="counter__head" aria-hidden="true">
          <span class="lozenge"></span>
        </div>

        <div class="counter__stack" id="stack" aria-hidden="true"></div>

        <p class="counter__date" id="date"></p>
      </div>
    </div>

    <script src="js/index.js"></script>
  </body>
</html>
